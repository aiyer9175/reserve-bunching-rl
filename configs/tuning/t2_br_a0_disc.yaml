# M2 PPO tuning (PREREGISTRATION Section 8), variant t2. Tuning seeds 100-101 only.
run_id: tune_t2_br_a0_disc
n_bidders: 4
value_dist:
  kind: uniform
reserves:
  r_low: 0.1
  r_high: 0.5
  p_high: 0.5
  mode: mixed
population:
- learner
- A0
- A0
- A0
learner:
  kind: A3-disc
  obs: full
  action: categorical
  mask_above_value: false
  wrapper: none
  init: truthful
ppo:
  updates: 5000
  lr_hold_frac: 0.5
  lr_final_frac: 0.1
  auctions_per_update: 32768
eval:
  every: 100
  early_stop: false
