# M3 primary grid (SPEC 9). H6a: two-stage learner trained with no reserve (r = 0), clamp to r at evaluation.
# Trained once per seed; this run evaluates at p_high = 0.5. The p_high = 0.95 and r_high-only
# evaluations reuse the saved checkpoint.
run_id: m3_a2r0
n_bidders: 4
value_dist: {kind: uniform}
population: [learner, learner, learner, learner]
reserves: {r_low: 0.10, r_high: 0.50, p_high: 0.5, mode: none}
eval_reserves: {r_low: 0.10, r_high: 0.50, p_high: 0.5}
learner: {kind: A2-r0, obs: blind, action: beta, mask_above_value: false, wrapper: censor, init: truthful}
ppo: {updates: 5000, lr_hold_frac: 0.5, lr_final_frac: 0.1}  # frozen M3 settings; 8,192 auctions/update (default)
eval: {every: 50, early_stop: true}
