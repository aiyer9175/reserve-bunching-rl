[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rbrl"
version = "0.1.0"
description = "Do learning bidders discover the reserve-price heuristic?"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=14",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "tqdm>=4.65",
]

[project.optional-dependencies]
rl = ["torch>=2.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: Monte Carlo acceptance tests (run with -m slow)"]
addopts = "-m 'not slow'"
